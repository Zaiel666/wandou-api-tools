<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>资产</title>
  <link rel="icon" href="./logo.png" type="image/png">
  <link rel="stylesheet" href="./fluid-glass.css">
  <style>
    :root{--bg:#f4f6f5;--panel:#fff;--panel-soft:#f8faf9;--line:#dfe5e1;--text:#18211d;--muted:#6c7771;--green:#28ad5f;--green-soft:#e4f6e9;--shadow:0 14px 38px rgba(30,45,36,.08)}
    *{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg);font-family:"Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-weight:400}.asset-shell{min-height:100vh;padding:22px}.asset-topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.9);box-shadow:var(--shadow)}.asset-brand,.asset-actions{display:flex;align-items:center;gap:12px}.asset-brand img{width:34px;height:34px}.asset-brand strong{font-size:17px}.asset-back,.asset-refresh{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:var(--panel);cursor:pointer}.asset-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;margin-top:18px}.asset-sidebar,.asset-main{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}.asset-sidebar{padding:14px;height:max-content;position:sticky;top:18px}.asset-sidebar h2{margin:4px 8px 12px;font-size:13px;font-weight:600}.asset-filter{width:100%;height:38px;margin:2px 0;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border:0;border-radius:9px;color:var(--muted);background:transparent;text-align:left;cursor:pointer}.asset-filter.active{color:#176c3a;background:var(--green-soft);font-weight:600}.asset-filter span:last-child{font-size:11px}.asset-main{min-width:0;padding:18px}.asset-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}.asset-heading h1{margin:0;font-size:24px;line-height:1.2}.asset-heading p{margin:5px 0 0;color:var(--muted);font-size:12px}.asset-search{width:min(340px,42vw);height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:var(--panel-soft);outline:none}.asset-search:focus{border-color:#62bf84;box-shadow:0 0 0 3px rgba(40,173,95,.1)}.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.asset-card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--panel-soft)}.media-card{cursor:zoom-in}.media-preview{aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;background:#edf1ef}.media-preview img,.media-preview video{width:100%;height:100%;object-fit:contain;background:#101412}.asset-card-body{padding:11px}.asset-card-title{margin:0 0 4px;overflow:hidden;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.asset-card-meta{color:var(--muted);font-size:11px}.skill-card{padding:14px;display:grid;grid-template-rows:auto 1fr auto;min-height:188px;background:linear-gradient(145deg,#fff,#f6faf7)}.skill-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.skill-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:#fff;background:#26332d;font-size:12px}.installed-badge{padding:3px 7px;border-radius:99px;color:#247443;background:var(--green-soft);font-size:10px}.skill-card h3{margin:12px 0 5px;font-size:14px}.skill-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.skill-use{height:34px;margin-top:12px;border:1px solid #b8d8c3;border-radius:8px;color:#196f3c;background:#f7fff9;cursor:pointer}.skill-use.selected{color:#fff;border-color:var(--green);background:var(--green)}.asset-empty{grid-column:1/-1;padding:80px 20px;text-align:center;color:var(--muted)}.asset-load-more{grid-column:1/-1;height:40px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:var(--panel-soft);cursor:pointer}.asset-lightbox{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:32px;background:rgba(11,15,13,.72);backdrop-filter:blur(12px)}.asset-lightbox.open{display:grid}.asset-lightbox img,.asset-lightbox video{max-width:92vw;max-height:86vh;object-fit:contain}.lightbox-close{position:absolute;top:20px;right:20px;width:38px;height:38px;border:1px solid rgba(255,255,255,.3);border-radius:50%;color:#fff;background:rgba(0,0,0,.25);font-size:22px;cursor:pointer}@media(max-width:760px){.asset-shell{padding:10px}.asset-layout{grid-template-columns:1fr}.asset-sidebar{position:static;display:flex;gap:4px;overflow:auto}.asset-sidebar h2{display:none}.asset-filter{min-width:max-content}.asset-heading{align-items:stretch;flex-direction:column}.asset-search{width:100%}}
    body.dark{--bg:#101412;--panel:#1b211e;--panel-soft:#161b18;--line:#343d38;--text:#eef4f0;--muted:#a4afa9;--green-soft:#1c3b29;--shadow:0 18px 46px rgba(0,0,0,.28)}body.dark .asset-topbar{background:rgba(27,33,30,.92)}body.dark .skill-card{background:linear-gradient(145deg,#1d2420,#171c19)}body.dark .media-preview{background:#0c100e}
  </style>
</head>
<body>
  <main class="asset-shell">
    <header class="asset-topbar">
      <div class="asset-brand"><img src="./logo.png" alt=""><strong>资产</strong></div>
      <div class="asset-actions"><button class="asset-refresh" id="refreshAssets" type="button">刷新</button><button class="asset-back" type="button" onclick="history.back()">返回</button></div>
    </header>
    <div class="asset-layout">
      <aside class="asset-sidebar">
        <h2>资产类型</h2>
        <button class="asset-filter active" data-filter="all"><span>全部资产</span><span data-count="all">0</span></button>
        <button class="asset-filter" data-filter="image"><span>图片</span><span data-count="image">0</span></button>
        <button class="asset-filter" data-filter="video"><span>视频</span><span data-count="video">0</span></button>
        <button class="asset-filter" data-filter="skill"><span>已安装 Skill</span><span data-count="skill">0</span></button>
      </aside>
      <section class="asset-main">
        <div class="asset-heading"><div><h1 id="assetTitle">全部资产</h1><p>自动汇总节点画布生成的图片、视频和本机已安装 Skill。</p></div><input class="asset-search" id="assetSearch" type="search" placeholder="搜索资产或 Skill…"></div>
        <div class="asset-grid" id="assetGrid"></div>
      </section>
    </div>
  </main>
  <div class="asset-lightbox" id="assetLightbox"><button class="lightbox-close" type="button" aria-label="关闭">×</button><div id="lightboxMedia"></div></div>
  <script src="./skill-catalog.js"></script>
  <script>
    const grid=document.getElementById('assetGrid'),search=document.getElementById('assetSearch'),title=document.getElementById('assetTitle');let filter='all',assets=[],visibleLimit=60;
    const escapeHtml=(v)=>String(v||'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const indexedPrefix='indexed-media:';
    function theme(){const dark=(localStorage.getItem('ai-tools-theme')||localStorage.getItem('wd-theme'))==='dark';document.body.classList.toggle('dark',dark)}
    async function resolveMedia(value){if(!String(value||'').startsWith(indexedPrefix))return value||'';const id=value.slice(indexedPrefix.length);try{const r=await window.wandouShell?.readCanvasMedia?.({id});if(r?.success)return r.value||''}catch(_e){}return await new Promise((resolve)=>{const q=indexedDB.open('ai-node-canvas-media-v1',2);q.onerror=()=>resolve('');q.onsuccess=()=>{try{const t=q.result.transaction('media','readonly').objectStore('media').get(id);t.onsuccess=()=>resolve(t.result?.value||'');t.onerror=()=>resolve('')}catch(_e){resolve('')}}})}
    async function load(){theme();visibleLimit=60;const skills=await WandouSkills.list();const media=[],seen=new Set();for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key?.startsWith('aiCanvasStateV1'))continue;let state;try{state=JSON.parse(localStorage.getItem(key)||'null')}catch(_e){continue}for(const node of state?.nodes||[]){if(node?.type!=='result'||!['image','video'].includes(node.mediaType))continue;const stored=node.previewUrl||node.mediaUrl||node.fullUrl||'',fullStored=node.fullUrl||node.mediaUrl||node.previewUrl||'';if(!stored||seen.has(stored))continue;seen.add(stored);media.push({type:node.mediaType,name:node.title||node.prompt?.slice(0,36)||(`${node.mediaType==='video'?'视频':'图片'}资产`),stored,fullStored,createdAt:Number(node.createdAt||node.id?.replace(/\D/g,'').slice(0,13))||0,width:node.width,height:node.height})}}assets=[...media,...skills.map(s=>({...s,type:'skill'}))];render()}
    async function render(){const q=search.value.trim().toLowerCase(),selected=WandouSkills.getSelected();const filtered=assets.filter(a=>(filter==='all'||a.type===filter)&&(!q||`${a.name||''} ${a.description||''}`.toLowerCase().includes(q))),items=filtered.slice(0,visibleLimit);for(const type of ['image','video','skill'])document.querySelector(`[data-count="${type}"]`).textContent=assets.filter(a=>a.type===type).length;document.querySelector('[data-count="all"]').textContent=assets.length;title.textContent={all:'全部资产',image:'图片',video:'视频',skill:'已安装 Skill'}[filter];if(!items.length){grid.innerHTML='<div class="asset-empty">这里还没有对应资产。生成图片或视频后会自动出现在这里。</div>';return}grid.innerHTML=items.map((a)=>a.type==='skill'?`<article class="asset-card skill-card"><div class="skill-card-head"><span class="skill-mark">SK</span><span class="installed-badge">已安装</span></div><div><h3>${escapeHtml(a.name)}</h3><p>${escapeHtml(a.description)}</p></div><button class="skill-use ${selected?.id===a.id?'selected':''}" data-skill-index="${assets.indexOf(a)}" type="button">${selected?.id===a.id?'已用于绘图':'用于绘图'}</button></article>`:`<article class="asset-card media-card" data-media-index="${assets.indexOf(a)}"><div class="media-preview" data-preview-index="${assets.indexOf(a)}"><span>正在读取…</span></div><div class="asset-card-body"><h3 class="asset-card-title">${escapeHtml(a.name)}</h3><div class="asset-card-meta">${a.type==='video'?'视频':'图片'}${a.width&&a.height?` · ${a.width}×${a.height}`:''}</div></div></article>`).join('')+(filtered.length>visibleLimit?`<button class="asset-load-more" type="button">加载更多（剩余 ${filtered.length-visibleLimit}）</button>`:'');grid.querySelectorAll('[data-skill-index]').forEach(b=>b.onclick=()=>{const skill=assets[Number(b.dataset.skillIndex)];WandouSkills.setSelected(skill);render()});grid.querySelectorAll('[data-preview-index]').forEach(async box=>{const a=assets[Number(box.dataset.previewIndex)],url=await resolveMedia(a.stored);a.url=url;box.innerHTML=url?(a.type==='video'?`<video src="${url}" muted preload="metadata"></video>`:`<img src="${url}" alt="">`):'<span>媒体暂不可用</span>'});grid.querySelectorAll('[data-media-index]').forEach(card=>card.onclick=async()=>{const a=assets[Number(card.dataset.mediaIndex)],url=await resolveMedia(a.fullStored||a.stored);if(!url)return;document.getElementById('lightboxMedia').innerHTML=a.type==='video'?`<video src="${url}" controls autoplay></video>`:`<img src="${url}" alt="">`;document.getElementById('assetLightbox').classList.add('open')});grid.querySelector('.asset-load-more')?.addEventListener('click',()=>{visibleLimit+=60;render()})}
    document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;visibleLimit=60;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});search.oninput=()=>{visibleLimit=60;render()};document.getElementById('refreshAssets').onclick=load;document.querySelector('.lightbox-close').onclick=()=>document.getElementById('assetLightbox').classList.remove('open');document.getElementById('assetLightbox').onclick=(e)=>{if(e.target.id==='assetLightbox')e.currentTarget.classList.remove('open')};load();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<script src="./theme-sync.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字动态海报 · 豌豆 AI</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./tool-studio.css"><link rel="stylesheet" href="./type-motion.css"><script defer src="./tool-studio.js"></script><script defer src="./type-motion.js"></script><link rel="stylesheet" href="./action-motion.css"><script defer src="./action-motion.js"></script></head>
<body class="tool-studio motion-page">
<link rel="stylesheet" href="./type-motion-refined.css">
<header class="motion-heading"><div><p class="eyebrow">文字 · 节奏 · 排版</p><h1>文字动态海报</h1><p>让一句话，拥有自己的节奏。无需接口，本地制作。</p></div><button id="theme" type="button">切换主题</button></header>
<main class="motion-workspace">
 <aside class="motion-controls" aria-label="海报设置">
  <section><h2>01 / 内容</h2><label>主标题 <textarea id="title" rows="3" maxlength="120">让灵感\n动起来</textarea></label><label>副标题 <input id="subtitle" maxlength="100" value="MAKE IDEAS MOVE · 豌豆 AI"></label></section>
  <section><h2>02 / 动效</h2><div class="motion-presets" id="presets"><button data-effect="wave" aria-pressed="true">波浪律动</button><button data-effect="rise" aria-pressed="false">错落入场</button><button data-effect="orbit" aria-pressed="false">环绕排版</button><button data-effect="echo" aria-pressed="false">叠影回声</button><button data-effect="pulse" aria-pressed="false">呼吸缩放</button><button data-effect="ticker" aria-pressed="false">横向滚动</button></div><label>循环时长 <select id="duration"><option value="3">3 秒</option><option value="5" selected>5 秒</option><option value="8">8 秒</option></select></label><label>文字大小 <input id="size" type="range" min="40" max="160" value="100"></label></section>
  <section><h2>03 / 画面</h2><label>画面比例 <select id="ratio"><option value="3:4">3:4 竖版海报</option><option value="1:1">1:1 方形</option><option value="16:9">16:9 横屏</option><option value="9:16">9:16 手机屏幕</option></select></label><label>字体 <select id="font"><option value="sans">现代黑体</option><option value="serif">经典宋体</option><option value="mono">等宽字体</option></select></label><div class="motion-colors"><label>背景<input type="color" id="background" value="#17181b"></label><label>文字<input type="color" id="foreground" value="#f5f5f5"></label><label>点缀<input type="color" id="accent" value="#a8d96a"></label></div><label class="motion-check"><input id="decoration" type="checkbox" checked> 显示装饰网格与星标</label></section>
  <section><h2>项目</h2><button id="saveProject">导出项目</button><label class="motion-file">导入项目<input id="loadProject" type="file" accept=".json,application/json"></label><p class="motion-note">草稿自动保存在本机。导出项目可备份文字和参数。</p></section>
 </aside>
 <section class="motion-stage"><div class="motion-stage-bar"><span>实时预览</span><span id="dimensions">900 × 1200</span></div><div class="motion-viewport"><canvas id="poster" width="900" height="1200" aria-label="动态海报预览"></canvas></div><div class="motion-playbar"><button id="play" aria-pressed="true">暂停</button><input id="timeline" aria-label="动画进度" type="range" min="0" max="1000" value="0"><span id="time">0.0 秒</span></div><div class="motion-export"><button id="png">导出 PNG</button><button id="html">导出动态 HTML</button><button class="primary" id="video">导出动画视频</button><button id="cancel" hidden>取消导出</button></div><p id="status" role="status" aria-live="polite">本地渲染，不上传文字，不消耗 API 额度。</p></section>
</main><script src="./type-motion-workbench.js" defer></script><script src="./type-motion-transport.js" defer></script><script src="./type-motion-alpha.js" defer></script></body></html>

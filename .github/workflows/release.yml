name: Build portable folder release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart("v")
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Invalid version: $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install desktop dependencies
        working-directory: desktop-client
        run: pnpm install --frozen-lockfile

      - name: Validate desktop scripts
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath "desktop-client" -Filter "*.js" | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Desktop script syntax check failed: $($_.Name)" }
          }

      - name: Validate release regressions
        shell: pwsh
        run: |
          $env:NODE_PATH = (Resolve-Path "desktop-client\node_modules").Path
          $tests = Get-ChildItem -LiteralPath "tests" -Filter "*.test.cjs" |
            Where-Object { $_.Name -ne "real-api-image-ratios.test.cjs" }
          foreach ($test in $tests) {
            node $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "Regression test failed: $($test.Name)" }
          }

      - name: Compile and validate portable updater
        shell: pwsh
        run: |
          $compiler = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /optimize+ /out:desktop-client\portable-updater.exe /reference:System.IO.Compression.FileSystem.dll desktop-client\portable-updater.cs
          if ($LASTEXITCODE -ne 0) { throw 'Portable updater compilation failed' }
          node tests\portable-updater-regression.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable updater regression test failed' }
          & pwsh -NoProfile -File tests\portable-updater-live-e2e.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Portable updater live upgrade test failed' }
          & pwsh -NoProfile -File tests\portable-updater-live-e2e.ps1 -LockInstallDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Locked-directory upgrade test failed' }

      - name: Build portable folder
        shell: pwsh
        run: |
          Set-Location desktop-client
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.env.VERSION; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          $versionFile = "..\app\VERSION.txt"
          $versionLines = @(Get-Content -LiteralPath $versionFile)
          if ($versionLines.Count -eq 0) { $versionLines = @("v$env:VERSION") } else { $versionLines[0] = "v$env:VERSION" }
          $versionLines | Set-Content -LiteralPath $versionFile -Encoding UTF8
          pnpm exec electron-builder --win dir --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "Electron build failed" }
          Set-Location ..
          & pwsh -NoProfile -File scripts\build-portable-package.ps1 -Version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "Portable package layout build failed" }
          $zip = Join-Path $PWD "dist\wandou-ai-tools-windows-x64.zip"
          & pwsh -NoProfile -File tests\portable-package-smoke.ps1 -Package $zip
          if ($LASTEXITCODE -ne 0) { throw "Packaged launcher/save/close smoke test failed" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *wandou-ai-tools-windows-x64.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ASCII
          $manifest = @{
            version = $env:VERSION
            downloadUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/wandou-ai-tools-windows-x64.zip"
            checksumUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/wandou-ai-tools-windows-x64.zip.sha256"
            notes = "v${env:VERSION}：新增双参考图风格迁移节点和统一下拉菜单；便携包外层默认只显示桌面启动器、网页版 HTML、使用说明三个入口，运行文件收进隐藏目录；兼容从旧版自动更新并在更新后正确重启。继续保留项目文件夹磁盘持久化、保存/透明 PNG、提示词工具和大图画布内存优化。"
          } | ConvertTo-Json
          $manifest | Set-Content -LiteralPath "dist\update-manifest.json" -Encoding UTF8

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG --title "豌豆AI工具 v$env:VERSION"
            gh release upload $env:TAG `
              "dist\wandou-ai-tools-windows-x64.zip" `
              "dist\wandou-ai-tools-windows-x64.zip.sha256" `
              "dist\update-manifest.json" `
              --clobber
          } else {
            gh release create $env:TAG `
              "dist\wandou-ai-tools-windows-x64.zip" `
              "dist\wandou-ai-tools-windows-x64.zip.sha256" `
              "dist\update-manifest.json" `
              --title "豌豆AI工具 v$env:VERSION" `
              --generate-notes
          }

name: Verify published Windows release

# Tags never rebuild or overwrite locally accepted binaries.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag, for example v2.0.31
        required: true
        default: v2.0.31

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $version = $tag.Substring(1)
          $zip = 'wandou-ai-tools-windows-x64.zip'
          $setup = "wandou-ai-tools-setup-$version.exe"
          gh release download $tag --repo $env:GH_REPO --dir verified-assets --pattern $zip --pattern "$zip.sha256" --pattern $setup --pattern "$setup.sha256" --pattern update-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          foreach ($name in @($zip, $setup)) {
            $line = (Get-Content -LiteralPath "verified-assets/$name.sha256" -Raw).Trim()
            if ($line -notmatch '^([a-fA-F0-9]{64})\s+\*?(.+)$') { throw "Invalid checksum file: $name" }
            $expected = $Matches[1].ToLowerInvariant()
            if ($Matches[2] -ne $name) { throw "Checksum filename differs: $name" }
            $actual = (Get-FileHash -LiteralPath "verified-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch: $name" }
          }
          $manifest = Get-Content -LiteralPath verified-assets/update-manifest.json -Raw | ConvertFrom-Json
          $base = "https://github.com/$env:GH_REPO/releases/download/$tag"
          if ($manifest.version -ne $version -or $manifest.downloadUrl -ne "$base/$zip" -or $manifest.checksumUrl -ne "$base/$zip.sha256") { throw 'Update manifest mismatch' }
          Write-Host "Verified published ZIP, installer and update manifest for $tag. No binaries were rebuilt or uploaded."
